let sceneBaseline=null;
function restoreSceneStorage(){if(sceneBaseline)for(const[key,value]of sceneBaseline){if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value);}}

async function showScene(scene,mobile){
 restoreSceneStorage();if(!sceneBaseline)sceneBaseline=sceneKeys.map(key=>[key,localStorage.getItem(key)]);

 try{
  localStorage.setItem('stellar-courier-mode-v3','campaign');localStorage.removeItem('stellar-courier-tutorial-v4');
  frame.style.width=mobile?'375px':'100%';frame.style.height=mobile?'667px':'900px';

  const w=frame.contentWindow,d=w.document;d.getElementById('start-button').click();await delay(80);
  async function fixture(setup){const original=w.StellarCore.step;let once=false;w.StellarCore.step=function(state,dt,input){if(!once){once=true;setup(state);}original(state,dt,input);};try{await delay(100);}finally{w.StellarCore.step=original;}}
  await fixture(state=>{state.hazards.forEach(h=>h.delay=100);state.level=scene==='upgrade'?1:2;state.levelCargo=scene==='upgrade'?3:5;state.cargo=1;state.deliveryCooldown=0;state.player.x=state.station.x;state.player.y=state.station.y;});
  if(scene!=='upgrade'){d.querySelector('[data-refit="standard"]').click();await delay(60);}
  if(scene==='failure'){d.getElementById('tutorial-skip').click();await delay(30);await fixture(state=>{state.hazards.forEach(h=>h.delay=100);state.levelCargo=6;state.levelSmashes=1;state.stageElapsed=64.99;});}
  document.getElementById('summary').textContent='QA 场景：'+(mobile?'375 × 667 手机':'桌面')+' / '+{upgrade:'改装选择',tutorial:'免扣时练习',failure:'目标缺项失败'}[scene];
  frame.scrollIntoView({block:'start'});if(scene==='upgrade')d.querySelector('.upgrade-choice[aria-pressed="true"]').focus({preventScroll:true});
 }finally{restoreSceneStorage();buttons.forEach(b=>b.disabled=false);}
}

 const button=document.createElement('button');button.textContent=(mobile?'手机':'桌面')+'：'+{upgrade:'改装',tutorial:'练习',failure:'失败'}[scene];button.style.cssText='padding:8px 11px;font-size:12px;background:#24454c;color:#bcebd9';button.onclick=()=>showScene(scene,mobile).catch(error=>{document.getElementById('summary').textContent='场景生成失败：'+error.message;});document.getElementById('qa-scenes').appendChild(button);
