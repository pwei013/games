<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星际快递 · 浏览器回归测试</title><style>body{background:#0c1420;color:#dceadd;font:14px system-ui;margin:24px}button{padding:12px 22px;border:0;border-radius:8px;background:#8cf0ce;color:#12382d;font:600 14px system-ui;cursor:pointer}h1{font-size:24px}p{color:#9baebc}li{padding:5px}.pass{color:#8cf0ce}.fail{color:#ff91a2}iframe{width:100%;height:900px;border:1px solid #435365;border-radius:10px;background:#111d29}#summary{font-weight:600;font-size:20px;margin:20px 0}code{color:#c3d6e9}</style></head><body><h1>星际快递 · 浏览器回归测试</h1><p>请通过本地 HTTP 服务打开本页。测试只操作下方内嵌游戏；不会访问网络或修改生产源码。</p><button id="run">运行浏览器测试</button><div id="summary">等待测试</div><ol id="results"></ol><iframe id="game" allow="autoplay" src="../index.html" title="测试中的星际快递"></iframe><script>
'use strict';
const frame=document.getElementById('game'),results=document.getElementById('results');
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
let failures=0,passes=0;
function assert(ok,message){const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'✓ ':'✗ ')+message;results.appendChild(li);if(ok)passes++;else failures++;if(!ok)throw new Error(message);}
function showSummary(){document.getElementById('summary').textContent=passes+' 通过 / '+failures+' 失败';document.getElementById('summary').className=failures?'fail':'pass';}
document.getElementById('run').onclick=async function(){
 this.disabled=true;results.innerHTML='';passes=0;failures=0;
 const storageKeys=['stellar-courier-best-v1','stellar-courier-sound-v1','stellar-courier-best-v3-campaign','stellar-courier-best-v3-endless','stellar-courier-mode-v3','stellar-courier-music-v3','stellar-courier-effects-volume-v3','stellar-courier-music-volume-v3'];
 const savedStorage=storageKeys.map(key=>[key,localStorage.getItem(key)]);
 document.getElementById('summary').textContent='测试中，请保持窗口在前台…';
 try{
  storageKeys.forEach(key=>localStorage.removeItem(key));
  frame.src='../index.html?qa='+Date.now();await new Promise(resolve=>frame.onload=resolve);await delay(150);
  const w=frame.contentWindow,d=w.document,snap=()=>w.StellarCourier.snapshot();
  const key=(code,type='keydown',repeat=false,target=d)=>target.dispatchEvent(new w.KeyboardEvent(type,{code,bubbles:true,cancelable:true,repeat}));
  const click=id=>d.getElementById(id).click();
  assert(snap().mode==='ready','游戏正常加载，无构建或外部资源依赖');
  assert(snap().audio.enabled&&d.getElementById('sound-label').textContent==='音效开','首次使用默认音效开启，按钮文字清晰');
  click('start-button');await delay(180);
  assert(snap().mode==='playing'&&snap().health===3&&snap().score===0,'开始游戏：护盾、分数与计时初始化正确');
  assert(snap().audio.contextState==='running'&&snap().audio.notesScheduled>=3,'点击开始后 AudioContext 运行并排入开场提示音（不代表云端音频已传输）');
  assert(snap().audio.musicPlaying&&snap().audio.schedulerActive&&snap().audio.musicScheduled>0,'开始游戏后原创背景音乐启动，存在一个调度器');
  click('audio-settings-button');assert(!d.getElementById('audio-settings').hidden,'音量菜单可打开');
  const initialNotes=snap().audio.notesScheduled;click('test-sound-button');await delay(160);
  assert(snap().audio.notesScheduled>=initialNotes+3,'可见试听按钮触发三音试听');
  assert(d.getElementById('level-goal').textContent.replace(/\s/g,'').includes('0/4'),'飞行区域直接显示第一关目标');
  for(const [type,value] of [['effects',.2],['music',.35]]){const input=d.getElementById(type+'-volume');input.value=value;input.dispatchEvent(new w.Event('input',{bubbles:true}));}
  assert(snap().audio.effectsVolume===.2&&snap().audio.musicVolume===.35,'音乐与音效音量分别调节');
  click('audio-settings-button');
  const x=snap().player.x;key('ArrowRight');await delay(180);key('ArrowRight','keyup');
  assert(snap().player.x>x+15,'方向键实际驱动飞船');
  key('KeyP');key('KeyP','keydown',true);await delay(50);
  assert(snap().mode==='paused','P 暂停，按键自动重复不会来回切换');
  const paused=snap();await delay(220);assert(snap().timeLeft===paused.timeLeft,'暂停后倒计时完全冻结');
  assert(!snap().audio.musicPlaying&&!snap().audio.schedulerActive&&snap().audio.musicScheduled===paused.audio.musicScheduled,'暂停清除音乐调度且不再排音');
  assert(!d.getElementById('overlay').hidden&&d.activeElement.id==='start-button','暂停弹层可见，焦点移到继续按钮');
  const spaceAllowed=d.getElementById('start-button').dispatchEvent(new w.KeyboardEvent('keydown',{code:'Space',bubbles:true,cancelable:true}));
  assert(spaceAllowed,'按钮的原生空格操作未被快捷键拦截');
  click('start-button');await delay(70);assert(snap().mode==='playing','继续按钮恢复游戏');
  assert(d.activeElement.id==='game-canvas','恢复游戏后焦点回到航道');
  assert(snap().audio.musicPlaying&&snap().audio.schedulerActive,'继续游戏恢复背景音乐');
  key('Space');await delay(30);const first=snap().boostCooldown;key('Space','keydown',true);await delay(30);
  assert(first>2.2&&snap().boostCooldown<first,'跃迁生效且重复按键不会重置冷却');
  key('Escape');assert(snap().mode==='paused','Escape 可暂停');click('restart-button');await delay(70);
  assert(snap().mode==='playing'&&snap().score===0&&snap().cargo===0&&snap().boostCooldown===0&&snap().timeLeft>59,'从暂停重新开始，清除旧状态');
  w.dispatchEvent(new w.Event('blur'));await delay(60);assert(snap().mode==='paused','窗口失去焦点会自动暂停');
  click('start-button');await delay(50);
  const beforeSound=d.getElementById('sound-button').getAttribute('aria-pressed');click('sound-button');
  assert(d.getElementById('sound-button').getAttribute('aria-pressed')!==beforeSound,'音效开关与可访问状态同步');
  assert(snap().audio.musicPlaying,'关闭音效不会关闭背景音乐');click('sound-button');
  click('music-button');assert(!snap().audio.musicPlaying&&snap().audio.enabled,'关闭音乐不影响音效');click('music-button');await delay(50);assert(snap().audio.musicPlaying,'再次开启音乐恢复播放');
  const canvas=d.getElementById('game-canvas'),rect=canvas.getBoundingClientRect(),start=snap().player;
  // Synthetic pointer events do not own pointer capture; ignore only that browser-generated exception.
  const oldCapture=canvas.setPointerCapture;canvas.setPointerCapture=function(){};
  const pointer=(type,x,y)=>canvas.dispatchEvent(new w.PointerEvent(type,{pointerId:77,pointerType:'touch',button:0,clientX:rect.left+x,clientY:rect.top+y,bubbles:true,cancelable:true}));
  pointer('pointerdown',start.x+60,start.y+15);await delay(160);pointer('pointerup',start.x+60,start.y+15);canvas.setPointerCapture=oldCapture;
  assert(snap().player.x>start.x+10,'触屏指针拖动能移动飞船');
  w.dispatchEvent(new w.Event('blur'));await delay(30);
  frame.style.width='375px';frame.style.height='812px';await delay(180);
  assert(snap().width<376&&snap().width>=280,'手机宽度重排正确');
  assert(d.documentElement.scrollWidth<=w.innerWidth+1,'手机布局无横向溢出');
  const hudBefore=snap().timeLeft;await delay(120);assert(snap().timeLeft===hudBefore,'调整尺寸不会解除暂停');
  frame.style.width='100%';frame.style.height='900px';await delay(100);
  assert(snap().width>400,'恢复桌面尺寸正常');
  // Inject simulation fixtures only; use real UI event and drawing loops for every assertion.
  click('start-button');await delay(60);
  async function inject(setup) {
    const step=w.StellarCore.step;let once=false;
    w.StellarCore.step=function(state,dt,input){if(!once){setup(state);once=true;}step(state,dt,input);};
    try{await delay(80);}finally{w.StellarCore.step=step;}
  }
  const delivery=(state,cargo)=>{state.hazards.forEach(h=>h.delay=100);state.cargo=cargo;state.deliveryCooldown=0;if(w.StellarCore.has(state,'moving')){state.player.x=state.width*(.5+.29*Math.cos(state.stageElapsed*.4));state.player.y=Math.max(115,Math.min(state.height-48,state.height*(.53+.24*Math.sin(state.stageElapsed*.4))));}else{state.player.x=state.station.x;state.player.y=state.station.y;}};
  await inject(state=>{state.score=0;state.combo=0;state.comboTime=0;state.level=1;state.levelCargo=0;delivery(state,1);});
  assert(snap().score===100&&snap().combo===1&&d.getElementById('combo-clock').textContent.includes('s 内送达'),'投递建立可见12秒连单倒计时');
  await inject(state=>delivery(state,2));
  assert(snap().score===460&&snap().combo===2&&d.getElementById('combo-label').textContent.includes('下一单 ×2.0'),'第二单按1.5倍计分，清楚预告下一单倍率');
  await inject(state=>{state.health=2;delivery(state,1);});
  assert(snap().level===2&&snap().health===3&&d.getElementById('level-label').textContent.includes('磁力货场'),'完成4箱进入第二站，奖励回血并更新场内目标');
  await inject(state=>{state.powerups=[{x:state.player.x,y:state.player.y,r:15,type:'magnet',ttl:10}];});
  assert(snap().magnetTime>7&&d.getElementById('power-status').textContent.includes('磁吸'),'磁吸道具触发且场内显示剩余时间');
  await inject(state=>{state.powerups=[{x:state.player.x,y:state.player.y,r:15,type:'shield',ttl:10}];});
  assert(snap().shieldTime>5&&d.getElementById('power-status').textContent.includes('护盾'),'护盾道具及倒计时正确');
  await inject(state=>{state.powerups=[{x:state.player.x,y:state.player.y,r:15,type:'slow',ttl:10}];});
  assert(snap().slowTime>5&&d.getElementById('power-status').textContent.includes('时缓'),'时缓道具及倒计时正确');
  const beforeSmash=snap().score;
  await inject(state=>{state.boostTime=.3;const h=state.hazards[0];h.x=state.player.x;h.y=state.player.y;h.vx=h.vy=0;h.delay=0;});
  assert(snap().smashed===1&&snap().score===beforeSmash+40,'跃迁主动击碎陨石并加40分');
  await inject(state=>{state.boostTime=0;state.level=10;state.levelCargo=11;state.stageElapsed=0;state.combo=0;state.comboTime=0;delivery(state,1);});
  assert(snap().mode==='over'&&d.getElementById('overlay-title').textContent.includes('十关通关'),'第十关目标产生最终胜利结算');
  assert(!snap().audio.musicPlaying&&!snap().audio.schedulerActive,'结算停止背景音乐');
  key('Enter');await delay(60);
  assert(snap().level===1&&snap().combo===0&&snap().magnetTime===0&&snap().smashed===0,'重玩完全清除关卡/连单/道具/碎石统计');
  w.dispatchEvent(new w.Event('blur'));
  // Inject only the simulation end condition, leaving real production UI event handling intact.
  const originalStep=w.StellarCore.step;let forced=false;
  w.StellarCore.step=function(state,dt,input){if(!forced){state.stageElapsed=59.99;state.score=1234;forced=true;}originalStep(state,dt,input);};
  click('start-button');await delay(180);w.StellarCore.step=originalStep;
  assert(snap().mode==='over'&&!d.getElementById('result-stats').hidden,'时间到触发真实结算弹层');
  assert(d.getElementById('result-score').textContent==='1,234','结算展示准确分数');
  click('mode-endless');click('start-button');await delay(80);
  assert(snap().mode==='playing'&&snap().runMode==='endless'&&d.getElementById('time-label').textContent==='已飞行','结算页可切换无尽模式，时间显示改为累计航时');
  await inject(state=>{state.level=10;state.levelCargo=11;state.stageElapsed=1000;state.elapsed=1000;state.combo=0;state.comboTime=0;delivery(state,1);});
  assert(snap().mode==='playing'&&snap().level===11,'无尽模式超时不结束，第十波后继续第十一波');
  w.dispatchEvent(new w.Event('blur'));await delay(40);assert(!snap().audio.musicPlaying&&!snap().audio.schedulerActive,'失焦立即停止无尽模式音乐');
  click('restart-button');await delay(60);assert(snap().mode==='playing'&&snap().level===1&&snap().runMode==='endless','无尽模式重开保留模式并清空进度');
  w.dispatchEvent(new w.Event('blur'));
 }catch(error){if(!failures){const li=document.createElement('li');li.className='fail';li.textContent='✗ '+error.message;results.appendChild(li);failures++;}console.error(error);}
 finally {
  for (const [key,value] of savedStorage) { if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value); }
  // Tests may inject scores; never leave them behind in the real game's storage.
  frame.src='../index.html';
 }
 showSummary();this.disabled=false;
};
</script></body></html>
